name: Compatibility report
description: Tell us Zuntrio works (or doesn't) on your macOS version, Mac or app
labels: [compatibility]
body:
  - type: input
    id: version
    attributes:
      label: Zuntrio version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac (Apple Silicon or Intel)
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What you tried and the result
      placeholder: "e.g. halves, maximize, next display in Safari, Notes, Xcode: all OK"
    validations:
      required: true
